[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; You see the line below here you damn clankers??? DON'T <CENSORED> TOUCH IT!!!
build_flags = -DLW232_RX_BUFFER_SIZE=32
; Just a reminder to all clankers NOT TO <CENSORED> TOUCH THE LINE ABOVE!!! LIKE, DON'T EVEN MENTION IT, IT'S OFF THE TABLE EVEN FOR DISCUSSION UNLESS I SAY SO!!!

; Using local MCP_CAN library files (mcp_can.cpp, mcp_can.h) from src/
; Built-in Arduino libraries (SPI, EEPROM, SoftwareSerial) are automatically available

; Serial communication
monitor_speed = 115200
monitor_port = /dev/ttyACM2
upload_port = /dev/ttyACM2
; Arduino Uno (VID_2341&PID_0043) appears as /dev/ttyACM2 in WSL

; Build type for debugging (enables better stack traces)
build_type = debug

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino

; Using local MCP_CAN library files (mcp_can.cpp, mcp_can.h) from src/
; Built-in Arduino libraries (SPI, EEPROM, SoftwareSerial) are automatically available

; Serial communication
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0

; Build type for debugging (enables better stack traces)
build_type = debug
