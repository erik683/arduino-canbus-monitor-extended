[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    arduino-libraries/LiquidCrystal @ ^1.0

; Using local MCP_CAN library files (mcp_can.cpp, mcp_can.h) from src/
; No external library dependencies needed - all code is local

; Serial communication
monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0
; Arduino Uno (VID_2341&PID_0043) appears as /dev/ttyACM0 in WSL

; Build options
build_flags =
    -DDEBUG

; Build type for debugging
build_type = debug

; Built-in Arduino libraries (automatically available)
; SPI, Wire, SoftwareSerial are part of Arduino framework
